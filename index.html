<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Effador's Calculator</title>
    <link rel="stylesheet" href="./assets/style.css" />
    <script src="./assets/script.js" defer></script>
    <link rel="icon" type="image/png" href="./assets/Icon2.png">
  </head>
  <body>
    <main>
      <div class="calc">
        <div class="display">
            <p><span id="display"></span></p>
        </div>
        <button id="n1">1</button> <!-- done -->
        <button id="n2">2</button> <!-- done -->
        <button id="n3">3</button> <!-- done -->
        <button id="n4">4</button> <!-- done -->
        <button id="n5">5</button> <!-- done -->
        <button id="n6">6</button> <!-- done -->
        <button id="n7">7</button> <!-- done -->
        <button id="n8">8</button> <!-- done -->
        <button id="n9">9</button> <!-- done -->
        <button id="n0">0</button> <!-- done -->
        <button id="plus">+</button> <!-- done -->
        <button id="minus">-</button> <!-- done -->
        <button id="multiply">*</button> <!-- done -->
        <button id="divide">/</button> <!-- done -->
        <button id="equals">=</button>
        <button id="sup">x<sup>y</sup></button>
        <button id="root">&radic;x</button>
        <button id="dot">.</button> <!--done-->
        <button id="bs">BS</button> <!-- done -->
        <button id="C">C</button> <!-- done -->
      </div>
    </main>
  </body>
</html>
